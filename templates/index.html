<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniDot 1.3</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <div class="logo">U</div>
                <div>
                    <h1>UniDot</h1>
                    <span>1.3</span>
                </div>
            </div>

            <button id="newChat" class="new-chat">+ New chat</button>

            <div class="sidebar-section">
                <div class="section-title">Tools</div>
                <button class="side-btn" id="statusBtn">System status</button>
                <button class="side-btn" id="memoryBtn">My memories</button>
                <button class="side-btn" id="clearMemoryBtn">Clear memories</button>
            </div>

            <div class="sidebar-bottom">
                <div id="connection" class="connection">
                    Checking local AI...
                </div>
                <div class="local-note">Runs on your PC</div>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <div>
                    <h2>UniDot 1.3</h2>
                    <p>Your local AI assistant</p>
                </div>
                <div id="statusDot" class="status-dot" title="Local AI status"></div>
            </header>

            <section id="chat" class="chat">
                <div class="welcome">
                    <div class="welcome-logo">U</div>
                    <h2>Welcome to UniDot 1.3</h2>
                    <p>Local AI. Memory. Learning. All running on your computer.</p>

                    <div class="suggestions">
                        <button data-prompt="Tell me a joke">Tell me a joke</button>
                        <button data-prompt="What is Minecraft?">What is Minecraft?</button>
                        <button data-prompt="Explain gravity">Explain gravity</button>
                        <button data-prompt="What can you do?">What can you do?</button>
                    </div>
                </div>
            </section>

            <footer class="composer-wrap">
                <div class="composer">
                    <textarea id="input" rows="1" placeholder="Message UniDot..."></textarea>
                    <button id="send" class="send" title="Send">
                        ➤
                    </button>
                </div>
                <div class="hint">Enter to send · Shift+Enter for a new line</div>
            </footer>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
